<!-- @dsCard group="Components" name="Table: card, chips, seat, pot" subtitle="The three objects that carry the whole game" viewport="700x430" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="../../styles.css" />
<style>
  /* Specimen layout only. Every component below is styled by the shipped
     component layer in styles.css — this page must never restate it. */
  body { padding: 22px 24px; background: var(--ns-felt); }
  .g { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .lbl { font: var(--ns-t-label); letter-spacing: var(--ns-track); text-transform: uppercase; color: var(--ns-muted); margin: 18px 0 8px; }
  .lbl:first-child { margin-top: 0; }
</style></head>
<body>
  <div class="lbl">PlayingCard — rank, suit, nothing else</div>
  <div class="g" style="gap:8px">
    <div class="ns-card" style="color:var(--ns-suit-red)"><div class="ns-card__r">A</div><div class="ns-card__s">♥</div></div>
    <div class="ns-card" style="color:var(--ns-suit-red)"><div class="ns-card__r">10</div><div class="ns-card__s">♦</div></div>
    <div class="ns-card" style="color:var(--ns-suit-black)"><div class="ns-card__r">Q</div><div class="ns-card__s">♠</div></div>
    <div class="ns-card" style="color:var(--ns-suit-blue)"><div class="ns-card__r">7</div><div class="ns-card__s">♣</div></div>
    <div class="ns-card ns-card--back"></div>
  </div>

  <div class="lbl">ChipStack — value printed as well as coloured</div>
  <div class="ns-stack">
    <div class="ns-chip" style="background:var(--ns-chip-1k);color:#241703">1K</div>
    <div class="ns-chip" style="background:var(--ns-chip-500);color:#140F2E;margin-left:var(--ns-chip-overlap)">500</div>
    <div class="ns-chip" style="background:var(--ns-chip-100);color:var(--ns-text);margin-left:var(--ns-chip-overlap)">100</div>
    <div class="ns-chip" style="background:var(--ns-chip-25);color:#0C1F14;margin-left:var(--ns-chip-overlap)">25</div>
    <div class="ns-chip" style="background:var(--ns-chip-5);color:#fff;margin-left:var(--ns-chip-overlap)">5</div>
    <div class="ns-chip" style="background:var(--ns-chip-1);color:#15130F;margin-left:var(--ns-chip-overlap)">1</div>
  </div>

  <div class="lbl">Seat — at rest, and on the clock</div>
  <div class="g">
    <div class="ns-seat">
      <div class="ns-seat__av">MK</div>
      <div class="ns-seat__body">
        <div class="ns-seat__n">Mikko</div>
        <div class="ns-seat__s">12,400</div>
      </div>
      <span class="ns-badge">Fold</span>
    </div>
    <div class="ns-seat ns-seat--turn">
      <div class="ns-seat__av" style="color:var(--ns-signal)">YOU</div>
      <div class="ns-seat__body">
        <div class="ns-seat__n">Guest</div>
        <div class="ns-seat__s">200,000</div>
      </div>
      <span class="ns-badge ns-badge--turn">Your turn</span>
    </div>
  </div>

  <div class="lbl">PotDisplay — it counts, it does not perform</div>
  <div class="ns-pot" style="text-align:left">
    <div class="ns-pot__label">Pot</div>
    <div class="ns-pot__v">18,600</div>
  </div>
</body></html>
