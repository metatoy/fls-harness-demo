<!-- @dsCard group="Components" name="Core: Button, Badge, Figure" subtitle="One accented action per screen; state said in a word" viewport="700x330" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="../../styles.css" />
<style>
  /* Specimen layout only. Every component below is styled by the shipped
     component layer in styles.css — this page must never restate it. */
  body { padding: 22px 24px; background: var(--ns-ground); }
  .g { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .lbl { font: var(--ns-t-label); letter-spacing: var(--ns-track); text-transform: uppercase; color: var(--ns-muted); margin: 18px 0 8px; }
  .lbl:first-child { margin-top: 0; }
</style></head>
<body>
  <div class="lbl">Button — one accented action per screen</div>
  <div class="g">
    <button class="ns-btn ns-btn--act">Call 4,000</button>
    <button class="ns-btn">Raise to 12,000</button>
    <button class="ns-btn ns-btn--fold">Fold</button>
    <button class="ns-btn ns-btn--danger">Leave table</button>
    <button class="ns-btn" disabled>Check</button>
  </div>

  <div class="lbl">Badge — state said in a word, never colour alone</div>
  <div class="g" style="align-items:center">
    <span class="ns-badge ns-badge--turn">Your turn</span>
    <span class="ns-badge ns-badge--win">Pot won</span>
    <span class="ns-badge ns-badge--lose">Busted</span>
    <span class="ns-badge ns-badge--warn">Blinds up</span>
    <span class="ns-badge">Sitting out</span>
  </div>

  <div class="lbl">Figure — tabular, grouped, never celebratory</div>
  <div class="g" style="gap:36px">
    <div class="ns-fig">
      <div class="ns-fig__label">Your roll</div>
      <div class="ns-fig__v ns-fig__v--lg">200,000</div>
    </div>
    <div class="ns-fig">
      <div class="ns-fig__label">Stack</div>
      <div class="ns-fig__v">12,400</div>
    </div>
    <div class="ns-fig">
      <div class="ns-fig__label">Won</div>
      <div class="ns-fig__v ns-fig__v--win">4,200</div>
    </div>
  </div>
</body></html>
