<!DOCTYPE html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="styles.css" />
<style>
  body { margin: 0; padding: 26px 28px; background: var(--ns-felt); display: flex; flex-direction: column; justify-content: space-between; min-height: 260px; box-sizing: border-box; }
  .wm { font: 700 42px/.95 var(--ns-ui); letter-spacing: -.03em; color: var(--ns-text); }
  .sub { font: var(--ns-t-label); letter-spacing: var(--ns-track); text-transform: uppercase; color: var(--ns-muted); margin-top: 8px; }
  .sw { display: flex; gap: 6px; margin-top: 20px; }
  .sw span { width: 46px; height: 46px; border-radius: var(--ns-r-sm); }
  .card { width: 44px; height: 62px; border-radius: var(--ns-r-xs); background: var(--ns-cardface); color: var(--ns-suit-red);
          display: flex; flex-direction: column; justify-content: space-between; padding: 5px 6px; box-sizing: border-box; box-shadow: var(--ns-lift-card); }
  .card__r { font: 600 15px/1 var(--ns-ui); } .card__s { font: 13px/1 var(--ns-ui); text-align: right; }
  .row { display: flex; align-items: flex-end; gap: 10px; }
</style></head>
<body>
  <div>
    <div class="wm">Night Shift</div>
    <div class="sub">Poker · warm dark room, one cool signal</div>
  </div>
  <div class="row">
    <div class="card"><div class="card__r">A</div><div class="card__s">♥</div></div>
    <div class="sw">
      <span style="background:var(--ns-signal)"></span>
      <span style="background:var(--ns-raised)"></span>
      <span style="background:var(--ns-win)"></span>
      <span style="background:var(--ns-lose)"></span>
      <span style="background:var(--ns-warn)"></span>
    </div>
  </div>
</body></html>
